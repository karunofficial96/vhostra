name: Package and release Vhostra
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag to build
        required: true
        type: string
      publish:
        description: Publish the verified matrix to GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
            label: windows-x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            label: windows-arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
            label: macos-x64
          - runner: macos-latest
            platform: mac
            arch: arm64
            label: macos-arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            label: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            label: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify release tag and version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
      - run: npm ci
      - run: npm run build
      - name: Install RPM inspection tool
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build native packages
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify this job's packages and executable architecture
        shell: bash
        run: node scripts/verify-release.mjs release "$(node -p 'require("./package.json").version')" ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Smoke packaged Windows CLI
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $folder = if ('${{ matrix.arch }}' -eq 'x64') { 'win-unpacked' } else { 'win-arm64-unpacked' }
          & "release/$folder/vhostra.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows installer, user PATH and uninstaller
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $before = [string](Get-ItemProperty HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path
          $installer = Resolve-Path "release/Vhostra-$(node -p 'require("./package.json").version')-windows-${{ matrix.arch }}.exe"
          $install = Start-Process $installer -ArgumentList '/S', '/currentuser' -Wait -PassThru
          $record = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like 'Vhostra*' } | Select-Object -First 1
          $installLocation = if ($record) { [string]$record.InstallLocation } else { '' }
          $directoryExists = [bool]($installLocation -and (Test-Path -LiteralPath $installLocation -PathType Container))
          $cliExists = [bool]($directoryExists -and (Test-Path -LiteralPath (Join-Path $installLocation 'vhostra.cmd') -PathType Leaf))
          $exeExists = [bool]($directoryExists -and (Test-Path -LiteralPath (Join-Path $installLocation 'Vhostra.exe') -PathType Leaf))
          if ($install.ExitCode -ne 0 -or -not $cliExists -or -not $exeExists) {
            Write-Host "InstallLocation: $(if ($installLocation) { $installLocation } else { '<missing>' })"
            Write-Host "Installation directory exists: $directoryExists"
            Write-Host 'Installation root filenames:'
            if ($directoryExists) { Get-ChildItem -LiteralPath $installLocation -File -Force | Select-Object -ExpandProperty Name | Sort-Object | ForEach-Object { Write-Host "  $_" } }
            Write-Host "vhostra.cmd exists: $cliExists"
            Write-Host "Vhostra.exe exists: $exeExists"
            $failurePath = [string](Get-ItemProperty HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path
            $ownedDirectory = [string](Get-ItemProperty HKCU:\Software\Vhostra\CLI -Name Directory -ErrorAction SilentlyContinue).Directory
            $entryCount = if ($installLocation) { @($failurePath -split ';' | Where-Object { $_ -ieq $installLocation }).Count } else { 0 }
            Write-Host "Vhostra PATH component count: $entryCount"
            Write-Host "Vhostra PATH ownership recorded: $([bool]($installLocation -and $ownedDirectory -ieq $installLocation))"
            if ($install.ExitCode -eq 27 -and $directoryExists) {
              $helper = Join-Path $installLocation 'Vhostra.exe'
              $helperExists = Test-Path -LiteralPath $helper -PathType Leaf
              Write-Host "Installed Electron helper exists: $helperExists"
              if ($helperExists) {
                $stream = $null
                try {
                  $stream = [System.IO.File]::OpenRead($helper)
                  $reader = [System.IO.BinaryReader]::new($stream)
                  [void]$stream.Seek(0x3c, [System.IO.SeekOrigin]::Begin)
                  $peOffset = $reader.ReadInt32()
                  [void]$stream.Seek($peOffset + 4, [System.IO.SeekOrigin]::Begin)
                  Write-Host ('Installed helper PE machine: 0x{0:X4}' -f $reader.ReadUInt16())
                } catch {
                  Write-Host "Installed helper PE read failed: $($_.Exception.GetType().FullName)"
                } finally { if ($stream) { $stream.Dispose() } }
                $start = [System.Diagnostics.ProcessStartInfo]::new($helper)
                $start.UseShellExecute = $false
                $start.WorkingDirectory = $installLocation
                [void]$start.ArgumentList.Add('--vhostra-cli-path-install')
                [void]$start.ArgumentList.Add($installLocation)
                $probe = $null
                try {
                  $probe = [System.Diagnostics.Process]::Start($start)
                  Write-Host 'Independent helper process creation: succeeded'
                  if ($probe.WaitForExit(15000)) {
                    Write-Host "Independent helper process exit code: $($probe.ExitCode)"
                  } else {
                    Write-Host 'Independent helper process timed out'
                    try { $probe.Kill() } catch { }
                  }
                } catch [System.ComponentModel.Win32Exception] {
                  Write-Host 'Independent helper process creation: failed'
                  Write-Host "Windows launch error code: $($_.Exception.NativeErrorCode)"
                } catch {
                  Write-Host 'Independent helper process creation: failed'
                  Write-Host "Launch exception type: $($_.Exception.GetType().FullName)"
                  Write-Host "Launch exception HRESULT: $($_.Exception.HResult)"
                } finally { if ($probe) { $probe.Dispose() } }
              }
            }
            if ($install.ExitCode -eq 10) { throw 'Installer could not find the packaged CLI launcher (exit 10)' }
            $pathFailure = @{
              21 = 'invalid installation directory'
              22 = 'user PATH length limit'
              23 = 'writing the user PATH registry value'
              24 = 'writing the Vhostra PATH ownership registry value'
              25 = 'unexpected Electron PATH handler error'
              26 = 'Electron readiness failed before PATH setup'
              27 = 'launching the Electron PATH helper failed'
            }
            if ($pathFailure.ContainsKey($install.ExitCode)) { throw "Installer PATH setup failed at $($pathFailure[$install.ExitCode]) (exit $($install.ExitCode))" }
            if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
            if (-not $exeExists) { throw 'Installed Vhostra.exe is missing' }
            throw 'Installed CLI is missing'
          }
          $exeStream = [System.IO.File]::OpenRead((Join-Path $installLocation 'Vhostra.exe'))
          try {
            $exeReader = [System.IO.BinaryReader]::new($exeStream)
            [void]$exeStream.Seek(0x3c, [System.IO.SeekOrigin]::Begin)
            $peOffset = $exeReader.ReadInt32()
            [void]$exeStream.Seek($peOffset + 4, [System.IO.SeekOrigin]::Begin)
            $installedMachine = $exeReader.ReadUInt16()
          } finally { $exeStream.Dispose() }
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }
          if ($installedMachine -ne $expectedMachine) { throw ('Installed Vhostra.exe PE machine 0x{0:X4} does not match expected 0x{1:X4}' -f $installedMachine, $expectedMachine) }
          $userPath = [string](Get-ItemProperty HKCU:\Environment -Name Path).Path
          if (($userPath -split ';' | Where-Object { $_ -ieq $installLocation }).Count -ne 1) { throw 'Vhostra user PATH entry is missing or duplicated' }
          & (Join-Path $installLocation 'vhostra.cmd') --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed' }
          $pwsh = (Get-Command pwsh).Source
          $processPath = $env:PATH
          try {
            $env:PATH = @([Environment]::GetEnvironmentVariable('Path', 'Machine'), [Environment]::GetEnvironmentVariable('Path', 'User')) -join ';'
            & $pwsh -NoProfile -Command 'vhostra --help'
            if ($LASTEXITCODE -ne 0) { throw 'CLI failed from a fresh user PATH' }
          } finally { $env:PATH = $processPath }
          $reinstall = Start-Process $installer -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "Reinstall exited $($reinstall.ExitCode)" }
          $userPath = [string](Get-ItemProperty HKCU:\Environment -Name Path).Path
          if (($userPath -split ';' | Where-Object { $_ -ieq $installLocation }).Count -ne 1) { throw 'Reinstall duplicated or removed the user PATH entry' }
          $remove = Start-Process (Join-Path $installLocation 'Uninstall Vhostra.exe') -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller exited $($remove.ExitCode)" }
          $after = [string](Get-ItemProperty HKCU:\Environment -Name Path -ErrorAction SilentlyContinue).Path
          $beforeParts = @($before -split ';' | Where-Object { $_ -ne '' })
          $afterParts = @($after -split ';' | Where-Object { $_ -ne '' })
          $mismatches = @()
          for ($index = 0; $index -lt [Math]::Max($beforeParts.Count, $afterParts.Count); $index++) {
            if ($index -ge $beforeParts.Count -or $index -ge $afterParts.Count -or
                -not [string]::Equals($beforeParts[$index], $afterParts[$index], [StringComparison]::Ordinal)) {
              $mismatches += $index
            }
          }
          $vhostraRemains = @($afterParts | Where-Object { $_ -ieq $installLocation }).Count -gt 0
          if ($mismatches.Count -gt 0 -or $vhostraRemains) {
            Write-Host "PATH component counts before/after: $($beforeParts.Count)/$($afterParts.Count)"
            Write-Host "Changed component indexes: $($mismatches -join ',')"
            Write-Host "Vhostra component remains: $vhostraRemains"
            Write-Host "Component order or content changed: $($mismatches.Count -gt 0)"
            throw 'Uninstall changed unrelated user PATH components'
          }
      - name: Smoke packaged macOS CLI
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          folder=mac
          if [ '${{ matrix.arch }}' = arm64 ]; then folder=mac-arm64; fi
          node test/packaged-cli.mjs "$PWD/release/$folder/Vhostra.app/Contents/Resources/bin/vhostra"
      - name: Smoke packaged Linux CLI
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          folder=linux-unpacked
          if [ '${{ matrix.arch }}' = arm64 ]; then folder=linux-arm64-unpacked; fi
          node test/packaged-cli.mjs "$PWD/release/$folder/vhostra"
      - name: Test DEB install, CLI and removal
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cpu=amd64
          if [ '${{ matrix.arch }}' = arm64 ]; then cpu=arm64; fi
          fixture="$RUNNER_TEMP/vhostra-preserve"
          mkdir -p "$fixture"
          echo keep > "$fixture/site-data"
          sudo apt-get install -y "./release/Vhostra-$(node -p 'require("./package.json").version')-linux-$cpu.deb"
          test "$(readlink /usr/bin/vhostra)" = /opt/Vhostra/vhostra
          vhostra --help
          sudo apt-get remove -y vhostra
          test ! -e /usr/bin/vhostra
          test "$(cat "$fixture/site-data")" = keep
      - name: Smoke AppImage CLI integration
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cpu=x86_64
          if [ '${{ matrix.arch }}' = arm64 ]; then cpu=arm64; fi
          mkdir -p "$RUNNER_TEMP/vhostra-cli-bin"
          node -e 'import("./dist-electron/cli-integration.js").then(m => m.installAppImageCli(process.argv[1], process.argv[2]))' "$PWD/release/Vhostra-$(node -p 'require("./package.json").version')-linux-$cpu.AppImage" "$RUNNER_TEMP/vhostra-cli-bin/vhostra"
          APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/vhostra-cli-bin/vhostra" --help
      - uses: actions/upload-artifact@v4
        with:
          name: vhostra-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.rpm
            release/*.deb
            release/*.AppImage
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: vhostra-*
          path: release-assets
          merge-multiple: true
      - name: Verify full matrix and write checksums
        run: node scripts/verify-release.mjs release-assets "$(node -p 'require("./package.json").version')" all
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Vhostra ${RELEASE_TAG#v}" --generate-notes
