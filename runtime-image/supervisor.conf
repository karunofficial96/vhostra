[supervisord]
nodaemon=true
logfile=/var/log/vhostra/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3

[program:web]
command=/usr/local/bin/vhostra-web-server
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:mysql-tcp]
command=/usr/local/bin/vhostra-mysql-forward TCP4-LISTEN:3306,bind=127.0.0.1,reuseaddr,fork
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/mysql-tcp.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:mysql-socket]
command=/usr/local/bin/vhostra-mysql-forward UNIX-LISTEN:/run/mysqld/mysqld.sock,unlink-early,mode=0666,fork
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/mysql-socket.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:redis]
command=redis-server /etc/redis/vhostra.conf --daemonize no
user=redis
autostart=false
autorestart=unexpected
startsecs=2
stdout_logfile=/var/log/vhostra/redis.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:memcached]
command=/bin/sh -c 'exec memcached $(grep -v "^[[:space:]]*#" /etc/vhostra/memcached.conf)'
autostart=false
autorestart=unexpected
startsecs=2
stdout_logfile=/var/log/vhostra/memcached.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:php-backend]
command=/usr/local/bin/vhostra-php-backend
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/php.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

; Native Apache/Nginx logs have no built-in size rollover. One sleeping process
; checks only generated log paths, never external project trees, every 5 minutes.
[program:site-log-maintenance]
command=/bin/sh -c 'while sleep 300; do /usr/sbin/logrotate -s /var/log/vhostra/site-logrotate.state /etc/vhostra/php/site-logrotate.conf; done'
autostart=false
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/log-maintenance.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
