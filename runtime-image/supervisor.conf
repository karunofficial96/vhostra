[supervisord]
nodaemon=true
logfile=/var/log/vhostra/supervisord.log

[program:web]
command=/usr/local/bin/vhostra-web-server
autorestart=true
startsecs=3

[program:mariadb]
command=/usr/sbin/mariadbd --datadir=/var/lib/mysql --user=mysql
autorestart=true
startsecs=5

; Add-ons remain in this one Vhostra runtime container. The inert sleep branch
; lets Supervisor own their lifecycle without starting an optional service when
; it is disabled in Vhostra settings.
[program:redis]
command=/bin/sh -lc 'if [ "$VHOSTRA_REDIS" = true ]; then exec redis-server /etc/redis/redis.conf --daemonize no; fi; exec sleep infinity'
autorestart=true
startsecs=2

[program:memcached]
command=/bin/sh -lc 'if [ "$VHOSTRA_MEMCACHED" = true ]; then exec memcached -u root; fi; exec sleep infinity'
autorestart=true
startsecs=2

[program:php-backend]
command=/bin/sh -lc 'if [ "$VHOSTRA_WEB_SERVER" != openlitespeed ]; then exec /usr/local/lsws/bin/openlitespeed -n; fi; exec sleep infinity'
autorestart=true
startsecs=3

[program:https]
command=/bin/sh -lc 'if [ "$VHOSTRA_HTTPS" = true ]; then exec nginx -c /etc/vhostra/nginx/tls-gateway.conf -g "daemon off;"; fi; exec sleep infinity'
autorestart=true
startsecs=3
