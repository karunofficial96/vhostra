[supervisord]
nodaemon=true
logfile=/var/log/vhostra/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3

[program:web]
command=/usr/local/bin/vhostra-web-server
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:mariadb]
command=/usr/sbin/mariadbd --datadir=/var/lib/mysql --user=mysql
autorestart=unexpected
startsecs=5
stopwaitsecs=60
stdout_logfile=/var/log/vhostra/mariadb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:redis]
command=redis-server /etc/redis/vhostra.conf --daemonize no
autostart=false
autorestart=unexpected
startsecs=2
stdout_logfile=/var/log/vhostra/redis.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:memcached]
command=memcached -u nobody -l 127.0.0.1 -m 32 -c 128 -t 1
autostart=false
autorestart=unexpected
startsecs=2
stdout_logfile=/var/log/vhostra/memcached.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:php-backend]
command=/usr/local/bin/vhostra-php-backend
user=nobody
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/php.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

; Native Apache/Nginx logs have no built-in size rollover. One sleeping process
; checks only generated log paths, never external project trees, every 5 minutes.
[program:site-log-maintenance]
command=/bin/sh -c 'while sleep 300; do /usr/sbin/logrotate -s /var/log/vhostra/site-logrotate.state /etc/vhostra/php/site-logrotate.conf; done'
autostart=false
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/vhostra/log-maintenance.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
