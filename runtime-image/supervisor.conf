[supervisord]
nodaemon=true
logfile=/var/log/vhostra/supervisord.log

[program:openlitespeed]
command=/usr/local/lsws/bin/lswsctrl start
autorestart=true
startsecs=3

[program:mariadb]
command=/usr/sbin/mariadbd --datadir=/var/lib/mysql --user=mysql
autorestart=true
startsecs=5

; Optional add-ons are enabled by the entrypoint only when VHOSTRA_REDIS or
; VHOSTRA_MEMCACHED are true. They remain disabled by default.
